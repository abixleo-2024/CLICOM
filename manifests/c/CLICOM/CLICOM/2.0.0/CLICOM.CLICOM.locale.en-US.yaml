ReleaseNotes: |-
  CLICOM 2.0.0 is the complete production-grade release featuring:
  - TLS 1.3 fail-closed secure communications by default
  - Server-authoritative 5000 ms PTT arbitration floor control
  - Opus 48 kHz voice compression with adaptive bitrates
  - Exponential backoff reconnection and resilient watchdog keepalives
  - Live speech analysis, captions, and collaborative channel notes
  - Role-based administration and security keyword auditing
