ShortDescription: Secure, modular CLI push-to-talk voice and real-time collaboration communications suite.
Description: |-
  CLICOM is a secure, modular, extensible command-line communication system built in C11.
  It provides terminal-based Push-To-Talk (PTT) voice channels, TLS 1.3 mutual confidentiality,
  cryptographic authentication, real-time speech analytics, captions, collaborative notes,
  and role-based administrative governance.
