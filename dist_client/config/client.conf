# CLICOM Client Configuration
# ============================================================
# File: config/client.conf
# Phase 0: Structure defined. Values not yet active.
# ============================================================

[server]
# CLICOM server address and port.
# Change host to the public server address for cross-network deployment.
host = 127.0.0.1
port = 4821

[node]
# display_name : Human-readable label shown in the dashboard and to other
#                nodes. Mutable — can be changed freely.
#                The server generates an immutable UUID node identity
#                at first registration. This display_name is separate.
display_name = MY-NODE

[logging]
# Log level: error | warn | info | debug
level = info
# Uncomment to write logs to a file in addition to stderr:
# file = clicom-client.log

[speech]
# Speech analysis mode for CLICOM v2.0.
# This is advisory; the server's configured mode takes precedence.
# All session members are always informed of the active mode in
# SESSION_START messages (CLIP_TAG_SPEECH_ANALYSIS). Mandatory transparency.
#
# Options:
#   server_mediated  — server performs authorized STT (v2.0 default)
#   none             — no speech-to-text
#   e2e_private      — future: E2E encrypted, server cannot decode
analysis_mode = server_mediated
