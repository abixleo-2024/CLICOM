# CLICOM Security Analysis Rules
# ============================================================
# File: config/security_rules.conf
# ============================================================
#
# IMPORTANT — Advisory-Only Policy:
#
#   Keyword detection generates a SecurityEvent for admin review.
#   No automatic restriction, disconnection, or ban is EVER performed
#   based solely on keyword detection. Admin review is mandatory.
#
#   Context is always included in security events:
#     "The news reported a kidnapping yesterday."
#   should be reviewed by a human before any conclusion is drawn.
#
# Rule categories:
#   [THREAT]     — high-priority terms
#   [SUSPICIOUS] — medium-priority terms (admin-defined)
#   [CUSTOM]     — organization-specific terms
#
# One term per line. Lines beginning with # are comments.

[THREAT]
threat
hijack
bomb
kidnap
snatching
immediate evacuation

[SUSPICIOUS]
bypass
# Add administrator-defined suspicious terms here, one per line.

[CUSTOM]
# Add organization-specific terms here, one per line.

[SETTINGS]
# Number of words before/after a match to include for human context review.
context_window_words = 10

# Minimum severity to generate an admin notification:
#   INFO | SUSPICIOUS | THREAT
min_severity_for_alert = SUSPICIOUS

# Must always be: none
# Keyword events are advisory. Auto-action is forbidden by design.
auto_action = none
