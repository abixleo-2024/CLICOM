# CLICOM Server Configuration
# ============================================================
# File: config/server.conf
# Phase 0: Structure defined. Values not yet active.
# ============================================================

[server]
bind_address = 127.0.0.1
port         = 4821
max_clients  = 64

[admin]
# Admin nodes authenticate with a dedicated admin identity (not a client
# config flag). Admin credentials are stored server-side (hashed).
# Initial admin account setup: see docs/ADMIN_GUIDE.md (Phase 16+).
admin_port = 8766

[tls]
# TLS 1.3 provides ALL transport confidentiality and cryptographic integrity.
# CRC32 in the protocol header is for framing only, not security.
# Certificates required from Phase 2 onwards.
# cert_file = /etc/clicom/server.crt
# key_file  = /etc/clicom/server.key

[heartbeat]
# Presence timeout: node marked OFFLINE after this many missed heartbeats.
interval_seconds      = 15
timeout_seconds       = 10
missed_before_offline = 2

[ptt]
# Half-duplex PTT floor arbitration is server-authoritative at the channel level.
# If a speaker disconnects without PTT_RELEASE, the watchdog reclaims the
# floor after floor_lease_timeout_seconds.
floor_lease_timeout_seconds = 30

[speech]
# CLICOM v2.0 default: server_mediated.
# The server performs authorized speech-to-text transcription.
# All session members are informed of the active mode in SESSION_START
# (CLIP_TAG_SPEECH_ANALYSIS). Disclosure is mandatory.
#
# Options: none | server_mediated
# Note: e2e_private (future) disables server-side STT entirely.
analysis_mode = server_mediated

[security]
rules_file = security_rules.conf
# Keyword detection is ADVISORY ONLY. No automatic action is ever performed.
# All security events require admin review before any action is taken.
# auto_action MUST be: none
auto_action = none

[storage]
# Backend: sqlite (Phase 17+) | postgresql (future)
backend       = sqlite
database_file = clicom.db
# Channel records persist across server restarts.
# Active PTT state and in-progress sessions are reset on restart.
